/* Same-origin API — the backend serves this file from its /public folder,
   so relative paths work whether you run this locally or deploy it. */
const API_BASE = '/api';

let state = JSON.parse(JSON.stringify(DEFAULT_DATA));
let unsaved = false;
let authToken = localStorage.getItem('portfolio_admin_token') || null;
let unlocked = !!authToken;

function authHeaders(extra){ return Object.assign({}, extra||{}, authToken ? {Authorization:'Bearer '+authToken} : {}); }

/* ============ STORAGE (backed by the Express API) ============ */
async function loadData(){
  try{
    const res = await fetch(API_BASE+'/portfolio');
    if(res.ok){
      const parsed = await res.json();
      state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
      state.visibility = Object.assign({}, DEFAULT_DATA.visibility, parsed.visibility||{});
      state.resumeFile = Object.assign({}, DEFAULT_DATA.resumeFile, parsed.resumeFile||{});
      state.profile = Object.assign({}, DEFAULT_DATA.profile, parsed.profile||{}, {links:Object.assign({},DEFAULT_DATA.profile.links, (parsed.profile&&parsed.profile.links)||{})});
    }
  }catch(e){ console.error('Could not reach the backend — showing local defaults.', e); }
  // Theme is a per-visitor preference, kept in the browser rather than the shared portfolio record.
  state.theme = localStorage.getItem('portfolio_theme') || state.theme || 'light';
  applyTheme();
  renderAll();
}

async function saveData(){
  const saveStateEl = document.getElementById('saveState');
  if(saveStateEl) saveStateEl.textContent = 'Saving…';
  try{
    const res = await fetch(API_BASE+'/portfolio', {
      method:'PUT',
      headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify(state)
    });
    if(res.status===401){
      unlocked=false; authToken=null; localStorage.removeItem('portfolio_admin_token');
      if(saveStateEl) saveStateEl.textContent = 'Session expired — please log in again';
      renderLock();
      return;
    }
    if(!res.ok) throw new Error('save failed');
    unsaved = false;
    if(saveStateEl) saveStateEl.textContent = 'All changes saved';
  }catch(e){
    if(saveStateEl) saveStateEl.textContent = 'Save failed — check your connection and try again';
  }
}
function markUnsaved(){ unsaved = true; const el = document.getElementById('saveState'); if(el) el.textContent = 'Unsaved changes'; }

async function uploadFile(file){
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(API_BASE+'/upload', { method:'POST', headers: authHeaders(), body: fd });
  if(res.status===401){ unlocked=false; authToken=null; localStorage.removeItem('portfolio_admin_token'); renderLock(); throw new Error('unauthorized'); }
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Upload failed');
  return data.url;
}

/* ============ HELPERS ============ */
function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='html'){ e.innerHTML = attrs[k]; }
    else if(k.startsWith('on')){ e.addEventListener(k.slice(2), attrs[k]); }
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{ if(c===null||c===undefined) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function wireContactForm(){
  const form = document.getElementById('contactForm');
  if(!form) return;

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();

    const name = document.getElementById('cf-name');
    const email = document.getElementById('cf-email');
    const msg = document.getElementById('cf-msg');
    const status = document.getElementById('formStatus');
    const submitBtn = form.querySelector('button[type="submit"]');

    let valid = true;

    [
      ['f-name', name.value.trim().length > 0],
      ['f-email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())],
      ['f-msg', msg.value.trim().length > 0]
    ].forEach(([id, ok])=>{
      document.getElementById(id).classList.toggle('invalid', !ok);
      if(!ok) valid = false;
    });

    if(!valid){
      status.className = 'form-status show';
      status.style.color = '#C0524A';
      status.textContent = 'Please fix the highlighted fields.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    status.className = 'form-status';
    status.textContent = '';

    try{
      /*
       * Submit to the Express backend.
       * server.js exposes POST /api/contact and stores the message
       * in data/contacts.json. If SMTP variables are configured on
       * the server, it also forwards the message to your email.
       */
      const response = await fetch(API_BASE + '/contact', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: name.value.trim(),
          email: email.value.trim(),
          message: msg.value.trim()
        })
      });

      let data = {};
      try {
        data = await response.json();
      } catch (_) {
        data = {};
      }

      if(!response.ok || data.ok !== true){
        throw new Error(data.error || 'Could not send your message. Please try again.');
      }

      status.className = 'form-status show ok';
      status.style.color = '#3f8a52';
      status.textContent = 'Message sent — thanks for reaching out. I’ll get back to you soon.';
      form.reset();

    }catch(err){
      console.error('Contact form error:', err);
      status.className = 'form-status show';
      status.style.color = '#C0524A';
      status.textContent = err.message || 'Could not send your message. Please try again in a moment.';

    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  });
}

async function openAdmin(){
  adminOverlay.classList.add('open'); adminPanel.classList.add('open');
  if(unlocked && authToken){
    // Quietly confirm the stored token is still valid before trusting it.
    try{
      const res = await fetch(API_BASE+'/contact', { headers: authHeaders() });
      if(res.status===401){ unlocked=false; authToken=null; localStorage.removeItem('portfolio_admin_token'); renderLock(); return; }
    }catch(e){ /* offline — proceed optimistically */ }
    showAdminMain();
  } else { renderLock(); }
}
function closeAdmin(){ adminOverlay.classList.remove('open'); adminPanel.classList.remove('open'); }

async function renderLock(){
  adminMain.style.display='none';
  adminLockWrap.innerHTML='';
  adminLockWrap.appendChild(el('div',{class:'lock-screen'}, el('p',{style:'color:var(--text2);font-size:14px;'}, 'Checking editor status…')));
  let passwordSet = false;
  try{
    const res = await fetch(API_BASE+'/auth/status');
    const data = await res.json();
    passwordSet = !!data.passwordSet;
  }catch(e){
    adminLockWrap.innerHTML='';
    adminLockWrap.appendChild(el('div',{class:'lock-screen'}, el('p',{style:'color:var(--text2);font-size:14px;'}, 'Could not reach the backend server. Make sure it is running, then reopen the editor.')));
    return;
  }
  adminLockWrap.innerHTML='';
  const errorMsg = el('p',{style:'color:#C0524A;font-size:13px;display:none;'});
  const submit = async ()=>{
    const val = document.getElementById('lockInput').value;
    errorMsg.style.display='none';
    if(!passwordSet){
      if(val.length<6){ errorMsg.textContent='Please use at least 6 characters.'; errorMsg.style.display='block'; return; }
      const res = await fetch(API_BASE+'/auth/setup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:val})});
      const data = await res.json();
      if(!res.ok){ errorMsg.textContent=data.error||'Could not set password.'; errorMsg.style.display='block'; return; }
      authToken = data.token; localStorage.setItem('portfolio_admin_token', authToken); unlocked=true; showAdminMain(); return;
    }
    const res = await fetch(API_BASE+'/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:val})});
    const data = await res.json();
    if(!res.ok){ errorMsg.textContent=data.error||'Incorrect password.'; errorMsg.style.display='block'; return; }
    authToken = data.token; localStorage.setItem('portfolio_admin_token', authToken); unlocked=true; showAdminMain();
  };
  const input = el('input',{type:'password', id:'lockInput', placeholder: passwordSet ? 'Password' : 'Create a password (min. 6 characters)'});
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  const box = el('div',{class:'lock-screen'},
    el('p',{style:'color:var(--text2);font-size:14px;'}, passwordSet ? 'Log in to edit this portfolio.' : 'Set a password to protect the editor. This is checked by the backend server, not the browser.'),
    input, errorMsg,
    el('button',{class:'btn btn-primary', style:'width:100%;', onclick:submit}, passwordSet ? 'Log In' : 'Set Password & Continue')
  );
  adminLockWrap.appendChild(box);
}

function listOfTags(arr, onChange){
  const wrap = el('div',{});
  arr.forEach((it,i)=> wrap.appendChild(el('span',{class:'removable-tag'}, it, el('button',{onclick:()=>{arr.splice(i,1); onChange();}},'✕'))));
  const row = el('div',{class:'admin-tag-input'});
  const input = el('input',{placeholder:'Add item + Enter', style:'flex:1;padding:7px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);'});
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=input.value.trim(); if(v){ arr.push(v); input.value=''; onChange(); } } });
  row.appendChild(input);
  const container = el('div',{}, wrap, row);
  return container;
}

async function tabMessages(){
  adminBodyEl.appendChild(el('p',{class:'empty-note', style:'margin-bottom:12px;'}, 'Messages submitted through your Contact form arrive here.'));
  const loading = el('p',{class:'empty-note'}, 'Loading messages…');
  adminBodyEl.appendChild(loading);
  try{
    const res = await fetch(API_BASE+'/contact', { headers: authHeaders() });
    if(res.status===401){ unlocked=false; authToken=null; localStorage.removeItem('portfolio_admin_token'); renderLock(); return; }
    const messages = await res.json();
    loading.remove();
    if(!messages.length){ adminBodyEl.appendChild(el('p',{class:'empty-note'}, 'No messages yet.')); return; }
    messages.forEach(m=>{
      const card = el('div',{class:'admin-card'},
        el('div',{class:'admin-card-top'},
          el('strong',{}, m.name + (m.read?'':' • new')),
          el('div',{class:'admin-card-actions'},
            el('button',{class:'admin-icon-btn', title:'Delete', onclick: async ()=>{
              if(!confirm('Delete this message?')) return;
              await fetch(API_BASE+'/contact/'+m.id, {method:'DELETE', headers: authHeaders()});
              tabMessagesRefresh();
            }},'🗑')
          )
        ),
        el('div',{style:'font-size:12.5px;color:var(--text2);margin-bottom:8px;'}, `${m.email} · ${new Date(m.receivedAt).toLocaleString()}`),
        el('p',{style:'font-size:14px;'}, m.message)
      );
      if(!m.read){ fetch(API_BASE+'/contact/'+m.id+'/read', {method:'PATCH', headers: authHeaders()}); }
      adminBodyEl.appendChild(card);
    });
  }catch(e){
    loading.textContent = 'Could not load messages — check your connection.';
  }
}
function tabMessagesRefresh(){ adminBodyEl.innerHTML=''; tabMessages(); }

function tabAccount(){
  adminBodyEl.appendChild(el('p',{class:'empty-note', style:'margin-bottom:14px;'}, 'Manage the password used to access this editor.'));
  const oldInput = el('input',{type:'password', placeholder:'Current password'});
  const newInput = el('input',{type:'password', placeholder:'New password (min. 6 characters)'});
  const msg = el('p',{style:'font-size:13px;margin-top:8px;'});
  adminBodyEl.appendChild(el('div',{class:'admin-field'}, el('label',{},'Current Password'), oldInput));
  adminBodyEl.appendChild(el('div',{class:'admin-field'}, el('label',{},'New Password'), newInput));
  adminBodyEl.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick: async ()=>{
    const res = await fetch(API_BASE+'/auth/change-password', {method:'POST', headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({oldPassword:oldInput.value, newPassword:newInput.value})});
    const data = await res.json();
    msg.style.color = res.ok ? '#3f8a52' : '#C0524A';
    msg.textContent = res.ok ? 'Password updated.' : (data.error||'Could not update password.');
    if(res.ok){ oldInput.value=''; newInput.value=''; }
  }}, 'Update Password'));
  adminBodyEl.appendChild(msg);
  adminBodyEl.appendChild(el('hr',{style:'margin:24px 0;border:none;border-top:1px solid var(--border);'}));
  adminBodyEl.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick: logoutAdmin}, 'Log Out'));
}
